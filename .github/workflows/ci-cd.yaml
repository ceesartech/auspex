name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        # Pin versions so local + CI black/isort agree. Floating versions
        # caused intermittent "would reformat" diffs between Mac (py3.9)
        # and CI (py3.11) because black's target-version autodetect
        # depends on the running interpreter.
        run: |
          pip install --upgrade pip
          pip install flake8==7.1.1 black==25.11.0 isort==5.13.2 mypy==1.13.0

      - name: Run flake8
        run: flake8 services/api services/data-ingestion services/feature-engineering services/ml-models --max-line-length=120 --extend-ignore=E203,W503

      - name: Run black check
        # Show diffs in CI output so future drifts are debuggable.
        # pyproject.toml at repo root pins target-version + line-length.
        run: black --check --diff services/api services/data-ingestion services/feature-engineering services/ml-models

      - name: Run isort check
        run: isort --check-only --diff services/api services/data-ingestion services/feature-engineering services/ml-models

      - name: Run mypy
        run: |
          set -e
          for svc in api data-ingestion feature-engineering ml-models; do
            echo "::group::mypy services/$svc"
            (
              cd "services/$svc"
              PYTHONPATH=src python -m mypy src \
                --ignore-missing-imports \
                --implicit-optional \
                --disable-error-code=arg-type \
                --disable-error-code=assignment \
                --disable-error-code=attr-defined \
                --disable-error-code=import-untyped \
                --disable-error-code=misc \
                --disable-error-code=operator \
                --disable-error-code=return-value \
                --disable-error-code=truthy-function \
                --disable-error-code=union-attr \
                --disable-error-code=valid-type \
                --disable-error-code=var-annotated
            )
            echo "::endgroup::"
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: services/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: services/frontend
        run: npx playwright install --with-deps chromium

      - name: Lint frontend
        working-directory: services/frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: services/frontend
        run: npm run type-check

      - name: Test frontend
        working-directory: services/frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: services/frontend
        run: npm run build

      - name: Run frontend e2e tests
        working-directory: services/frontend
        run: npm run test:e2e

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: betting_system_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-torch.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/betting_system_test
        # Apply every numbered migration in lex order so new migrations
        # (e.g. 004_create_users.sql added with the bcrypt auth work)
        # are picked up automatically without editing this workflow.
        run: |
          set -e
          for f in services/data-ingestion/db/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=test_password psql -h localhost -U test_user \
              -d betting_system_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/betting_system_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          # Each service has its own src/ package and the tests import from it
          # using names like `from services.prediction_service import ...`. Running
          # `pytest services/...` from the repo root would auto-create a `services`
          # namespace package and shadow each service's inner `services/` subpackage,
          # so we cd into each service and run pytest with PYTHONPATH=src.
          set -e
          for svc in api data-ingestion feature-engineering ml-models; do
            echo "::group::pytest services/$svc"
            (
              cd "services/$svc"
              PYTHONPATH=src pytest tests -m "not integration" --rootdir=. \
                --cov=src --cov-append --cov-report=xml --cov-report=term -v
            )
            echo "::endgroup::"
          done

      - name: Run repo-root unit tests
        env:
          ENVIRONMENT: test
        run: |
          # tests/unit at the repo root holds ~1,050 tests covering the
          # scripts/ layer — including the EV/Kelly money-path math
          # (test_recommendation_math.py) and the calibration metrics.
          # They ran green locally for months while gating NOTHING in CI
          # (July-2026 audit §6.1). They need no DB/Redis.
          echo "::group::pytest tests/unit (repo root)"
          pytest tests/unit -q --rootdir=.
          echo "::endgroup::"

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/betting_system_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          # pytest exits 5 when no tests match the marker. That is fine here
          # because not every service has integration-marked tests.
          set -e
          for svc in api data-ingestion feature-engineering ml-models; do
            echo "::group::pytest services/$svc (integration)"
            rc=0
            (
              cd "services/$svc"
              PYTHONPATH=src pytest tests -m integration --rootdir=. -v
            ) || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              exit "$rc"
            fi
            echo "::endgroup::"
          done

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          # Each service writes its own coverage.xml in its own dir because
          # pytest is invoked from inside that dir (see Run unit tests above).
          files: >-
            ./services/api/coverage.xml,
            ./services/data-ingestion/coverage.xml,
            ./services/feature-engineering/coverage.xml,
            ./services/ml-models/coverage.xml
          # Tokenless uploads are rate-limited even on public repos. Add
          # CODECOV_TOKEN as a repo secret to lift the limit. Without it the
          # step still runs (fail_ci_if_error: false) and CI stays green.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, frontend]
    # Builds + pushes per-service images to ghcr.io with both the commit
    # SHA and `latest` tags. deploy_remote.sh on the VM pulls these
    # instead of rebuilding locally — saves the VM's CPU and disk and
    # gets deploys down from ~5 min to ~30s.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Only the services that actually run in compose. Add here if a new
        # long-running service with its own Dockerfile joins the stack.
        service: [api, airflow, frontend]
        include:
          - service: api
            context: .
            dockerfile: docker/Dockerfile.api
          - service: airflow
            context: .
            dockerfile: docker/Dockerfile.airflow
          - service: frontend
            context: services/frontend
            # docker/build-push-action resolves `file:` relative to the
            # workflow's working directory (the repo root), NOT the
            # context. Use the root-relative path; the `../../` form
            # docker-compose uses only works when compose itself parses
            # the build directive.
            dockerfile: docker/Dockerfile.frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Cache via the github-actions cache backend — first build is
          # the same speed, subsequent pushes are seconds faster.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # For the frontend, the public URL has to be baked in at
          # build time (NEXT_PUBLIC_* are inlined by next build). Falls
          # back to the canonical domain if vars.AUSPEX_DOMAIN isn't
          # set — set the repo variable to override on a custom domain.
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.AUSPEX_DOMAIN || 'auspex.ceesartech.com' }}
            NEXT_PUBLIC_WS_URL=wss://${{ vars.AUSPEX_DOMAIN || 'auspex.ceesartech.com' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [build]
    # Personal-VM deployment via SSH + docker compose. Opt in by setting:
    #   vars.DEPLOY_ENABLED=true
    #   vars.DEPLOY_HOST=<vm-ip-or-hostname>
    #   vars.DEPLOY_USER=<ssh-user>  (default: ubuntu)
    #   vars.DEPLOY_PATH=<repo-path-on-vm> (default: /opt/auspex)
    #   secrets.DEPLOY_SSH_KEY=<private-key-with-access-to-VM>
    # GKE-based deployment is gone; configure the VM once via
    # scripts/provision_vm.sh and CI just rolls images forward.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run scripts/deploy_remote.sh on the VM
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'auspex' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/auspex' }}
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE || 'origin' }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The deploy logic lives in scripts/deploy_remote.sh in the
          # repo on the VM. SSH passes the ghcr creds (so the VM can
          # docker-login to pull images) and the SHA tag built by the
          # `build` job. Output streams back to the GitHub Actions log.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && \
             REMOTE='$DEPLOY_REMOTE' BRANCH='$DEPLOY_BRANCH' \
             IMAGE_TAG='$IMAGE_TAG' \
             GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' \
             ./scripts/deploy_remote.sh"

      - name: Smoke test from CI side
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'auspex' }}
        run: |
          # The remote script already verifies /health from inside the
          # VM. We add one cross-network probe to catch reverse-proxy
          # issues (Caddy, DNS, firewall) too. If AUSPEX_DOMAIN isn't
          # set, just call the host's API port via SSH.
          for i in $(seq 1 10); do
            if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
                "curl -fsS http://localhost:8000/health" >/dev/null 2>&1; then
              echo "API healthy on VM"
              exit 0
            fi
            sleep 5
          done
          echo "API didn't return healthy from the VM"; exit 1
