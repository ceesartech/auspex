name: Ops — Rotate secrets

# Rotate every secret in /opt/auspex/.env on the VM (POSTGRES_PASSWORD,
# REDIS_PASSWORD, JWT_SECRET, SECRET_KEY, both Airflow keys,
# GRAFANA_PASSWORD) and re-derive DATABASE_URL / REDIS_URL /
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN. Applies the new Postgres
# password to the running DB, restarts services.
#
# Telegram bot token is NOT rotated — revoke + replace it manually via
# @BotFather, then paste into .env via SSH, then click this workflow.

on:
  workflow_dispatch:
    inputs:
      apply_db_password:
        description: 'Apply new POSTGRES_PASSWORD to running Postgres'
        required: false
        default: 'true'
        type: boolean

jobs:
  rotate:
    name: Rotate on VM
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust host key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rotate, apply, restart
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'auspex' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/auspex' }}
          APPLY_DB_PASSWORD: ${{ github.event.inputs.apply_db_password }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<EOF
            set -euo pipefail
            cd "$DEPLOY_PATH"
            ./scripts/regenerate_secrets.sh .env
            if [ "$APPLY_DB_PASSWORD" = "true" ]; then
              ./scripts/apply_db_password.sh .env
            fi
            ./scripts/restart_services.sh
            shred -u .env.bak 2>/dev/null || rm -f .env.bak
          EOF
