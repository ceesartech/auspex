{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: betting-system-ingress
  namespace: {{ include "betting-system.namespace" . }}
  labels:
    {{- include "betting-system.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.api.ingress.className }}
    cert-manager.io/cluster-issuer: {{ .Values.api.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  {{- if .Values.api.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.api.ingress.host }}
    secretName: betting-system-tls
  {{- end }}
  rules:
  - host: {{ .Values.api.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: betting-api
            port:
              number: {{ .Values.api.service.port }}
{{- end }}
