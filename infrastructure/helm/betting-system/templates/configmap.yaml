apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "betting-system.fullname" . }}-config
  namespace: {{ include "betting-system.namespace" . }}
  labels:
    {{- include "betting-system.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
