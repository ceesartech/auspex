name: Deploy to Staging

on:
  push:
    tags: ['v*-rc*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install gke-gcloud-auth-plugin
      run: gcloud components install gke-gcloud-auth-plugin

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io

    - name: Build and push images
      run: |
        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:${{ github.sha }} -f docker/Dockerfile.api .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:${{ github.sha }}

        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:${{ github.sha }} -f docker/Dockerfile.frontend services/frontend
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:${{ github.sha }}

        docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-scraper:${{ github.sha }} -f docker/Dockerfile.scraper .
        docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-scraper:${{ github.sha }}

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials betting-system-cluster-staging \
          --region us-central1 \
          --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy with Kustomize
      run: |
        cd infrastructure/kubernetes/overlays/staging
        kustomize edit set image \
          gcr.io/PROJECT_ID/betting-api=gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:${{ github.sha }} \
          gcr.io/PROJECT_ID/betting-frontend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:${{ github.sha }} \
          gcr.io/PROJECT_ID/betting-scraper=gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-scraper:${{ github.sha }}
        kustomize build . | kubectl apply -f -

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/betting-api -n betting-system --timeout=5m
        kubectl rollout status deployment/betting-frontend -n betting-system --timeout=5m

    - name: Run smoke tests
      run: |
        sleep 10
        API_URL=$(kubectl get ingress betting-system-ingress -n betting-system -o jsonpath='{.spec.rules[0].host}')
        curl -f "https://${API_URL}/health" || echo "Smoke test warning: API health check failed"

    - name: Verify deployment
      run: |
        kubectl get pods -n betting-system
        kubectl get services -n betting-system
