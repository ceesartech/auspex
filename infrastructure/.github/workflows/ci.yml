name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting
      run: |
        flake8 services/ --max-line-length=120
        black --check services/
        isort --check-only services/

    - name: Run tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest services/ -v --cov=services --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: true

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: services/frontend/package-lock.json

    - name: Install dependencies
      working-directory: services/frontend
      run: npm ci

    - name: Run linting
      working-directory: services/frontend
      run: npm run lint

    - name: Run type check
      working-directory: services/frontend
      run: npm run type-check

    - name: Run tests
      working-directory: services/frontend
      run: npm run test

    - name: Build
      working-directory: services/frontend
      run: npm run build

  build-images:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.api
        push: true
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:${{ github.sha }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: services/frontend
        file: services/frontend/Dockerfile
        push: true
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:${{ github.sha }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:latest

    - name: Build and push Scraper image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.scraper
        push: true
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-scraper:${{ github.sha }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-scraper:latest
