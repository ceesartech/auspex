name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Install gke-gcloud-auth-plugin
      run: |
        gcloud components install gke-gcloud-auth-plugin

    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials betting-system-cluster \
          --region us-central1 \
          --project ${{ secrets.GCP_PROJECT_ID }}

    - name: Update API deployment
      run: |
        kubectl set image deployment/betting-api \
          api=gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-api:${{ github.sha }} \
          -n betting-system

    - name: Update Frontend deployment
      run: |
        kubectl set image deployment/betting-frontend \
          frontend=gcr.io/${{ secrets.GCP_PROJECT_ID }}/betting-frontend:${{ github.sha }} \
          -n betting-system

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/betting-api -n betting-system --timeout=5m
        kubectl rollout status deployment/betting-frontend -n betting-system --timeout=5m

    - name: Verify deployment
      run: |
        kubectl get pods -n betting-system
        kubectl get services -n betting-system

    - name: Run smoke tests
      run: |
        curl -f https://api.betting-system.com/health || exit 1

    - name: Notify on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment failed!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
