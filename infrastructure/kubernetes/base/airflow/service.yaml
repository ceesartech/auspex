apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: betting-system
  labels:
    app: airflow
    component: webserver
spec:
  type: ClusterIP
  selector:
    app: airflow
    component: webserver
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
