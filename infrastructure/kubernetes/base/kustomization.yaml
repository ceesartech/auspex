apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: betting-system

commonLabels:
  app.kubernetes.io/part-of: betting-system
  app.kubernetes.io/managed-by: kustomize

resources:
- namespace.yaml
- configmap.yaml
- secrets.yaml
- api/deployment.yaml
- api/service.yaml
- api/hpa.yaml
- api/ingress.yaml
- postgres/statefulset.yaml
- postgres/service.yaml
- postgres/pvc.yaml
- redis/deployment.yaml
- redis/service.yaml
- airflow/deployment.yaml
- airflow/service.yaml
- frontend/deployment.yaml
- celery/deployment.yaml
- scraper/cronjob.yaml
- scraper/training-job.yaml
- monitoring/network-policy.yaml
- monitoring/pdb.yaml
- monitoring/cert-manager.yaml
- monitoring/rbac.yaml
