apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: betting-system
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery
        image: gcr.io/PROJECT_ID/betting-api:latest
        command: ["celery", "-A", "tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]

        envFrom:
        - configMapRef:
            name: betting-system-config
        - secretRef:
            name: betting-system-secrets

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - tasks.celery_app
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 60
