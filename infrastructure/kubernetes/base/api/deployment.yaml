apiVersion: apps/v1
kind: Deployment
metadata:
  name: betting-api
  namespace: betting-system
  labels:
    app: betting-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: betting-api
  template:
    metadata:
      labels:
        app: betting-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: betting-api-sa

      containers:
      - name: api
        image: gcr.io/PROJECT_ID/betting-api:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: betting-system-secrets
              key: DATABASE_URL

        envFrom:
        - configMapRef:
            name: betting-system-config
        - secretRef:
            name: betting-system-secrets

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        volumeMounts:
        - name: model-storage
          mountPath: /app/models
          readOnly: true

      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
