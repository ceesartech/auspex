apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-daily
  namespace: betting-system
  labels:
    app: scraper
spec:
  schedule: "0 6 * * *"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: scraper
        spec:
          restartPolicy: OnFailure
          containers:
          - name: scraper
            image: gcr.io/PROJECT_ID/betting-scraper:latest

            envFrom:
            - configMapRef:
                name: betting-system-config
            - secretRef:
                name: betting-system-secrets

            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-odds
  namespace: betting-system
  labels:
    app: scraper-odds
spec:
  schedule: "*/5 * * * *"
  timeZone: "America/Denver"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: scraper-odds
        spec:
          restartPolicy: OnFailure
          containers:
          - name: scraper-odds
            image: gcr.io/PROJECT_ID/betting-scraper:latest
            command: ["python", "-m", "scrapers.odds_scraper"]

            envFrom:
            - configMapRef:
                name: betting-system-config
            - secretRef:
                name: betting-system-secrets

            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "250m"
