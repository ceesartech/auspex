---
# Weekly automated model retraining CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retraining
  namespace: betting-system
  labels:
    app: model-retraining
    component: ml-models
spec:
  # Every Sunday at 02:00 UTC
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Allow up to 4 hours for training
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: model-retraining
            component: ml-models
        spec:
          restartPolicy: Never
          serviceAccountName: betting-api
          containers:
          - name: retraining
            image: gcr.io/PROJECT_ID/betting-training:latest
            command: [python, -m, services.ml_models.src.train]
            args:
            - --all-models
            - --upload-to-mlflow
            - --notify-on-completion
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: REDIS_URL
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: betting-config
                  key: MLFLOW_TRACKING_URI
            - name: MODEL_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: betting-config
                  key: MODEL_STORAGE_BUCKET
            resources:
              requests:
                cpu: 2000m
                memory: 4Gi
              limits:
                cpu: 4000m
                memory: 8Gi
            volumeMounts:
            - name: model-storage
              mountPath: /app/models
          volumes:
          - name: model-storage
            emptyDir: {}

---
# Drift-check CronJob – daily at 06:00 UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-check
  namespace: betting-system
  labels:
    app: drift-check
    component: ml-models
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: drift-check
        spec:
          restartPolicy: Never
          containers:
          - name: drift-check
            image: gcr.io/PROJECT_ID/betting-training:latest
            command: [python, monitoring/scripts/trigger-retraining.py]
            args: [--auto]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: REDIS_URL
            - name: K8S_NAMESPACE
              value: betting-system
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

---
# Performance-check CronJob – every 6 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: performance-check
  namespace: betting-system
  labels:
    app: performance-check
    component: ml-models
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: performance-check
        spec:
          restartPolicy: Never
          containers:
          - name: performance-check
            image: gcr.io/PROJECT_ID/betting-training:latest
            command: [python, monitoring/scripts/check-model-performance.py]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: betting-secrets
                  key: REDIS_URL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 256Mi
