apiVersion: v1
kind: ServiceAccount
metadata:
  name: betting-api-sa
  namespace: betting-system
  annotations:
    iam.gke.io/gcp-service-account: betting-system-api@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: betting-system-role
  namespace: betting-system
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: betting-system-rolebinding
  namespace: betting-system
subjects:
- kind: ServiceAccount
  name: betting-api-sa
  namespace: betting-system
roleRef:
  kind: Role
  name: betting-system-role
  apiGroup: rbac.authorization.k8s.io
