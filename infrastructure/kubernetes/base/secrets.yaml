apiVersion: v1
kind: Secret
metadata:
  name: betting-system-secrets
  namespace: betting-system
type: Opaque
stringData:
  # Database
  POSTGRES_USER: "betting_user"
  POSTGRES_PASSWORD: "REPLACE_WITH_SEALED_SECRET"

  # Redis
  REDIS_PASSWORD: "REPLACE_WITH_SEALED_SECRET"

  # JWT
  JWT_SECRET: "REPLACE_WITH_SEALED_SECRET"
  SECRET_KEY: "REPLACE_WITH_SEALED_SECRET"

  # Airflow
  AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_SEALED_SECRET"
  AIRFLOW__WEBSERVER__SECRET_KEY: "REPLACE_WITH_SEALED_SECRET"
