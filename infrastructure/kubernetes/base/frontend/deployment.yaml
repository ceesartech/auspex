apiVersion: apps/v1
kind: Deployment
metadata:
  name: betting-frontend
  namespace: betting-system
  labels:
    app: betting-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: betting-frontend
  template:
    metadata:
      labels:
        app: betting-frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/PROJECT_ID/betting-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http

        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.betting-system.com"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.betting-system.com"

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"

        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: betting-frontend
  namespace: betting-system
  labels:
    app: betting-frontend
spec:
  type: ClusterIP
  selector:
    app: betting-frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
