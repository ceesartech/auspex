groups:
  - name: infrastructure_alerts
    interval: 1m
    rules:

    - alert: DatabaseConnectionPoolExhausted
      expr: |
        pg_stat_activity_count / pg_settings_max_connections > 0.8
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "Database connection pool nearly exhausted"
        description: "Connection usage is at {{ $value | humanizePercentage }}"
        runbook: "https://runbooks.betting-system.com/DATABASE_ISSUES"

    - alert: DatabaseDown
      expr: up{job="postgres"} == 0
      for: 1m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL exporter cannot reach the database"
        runbook: "https://runbooks.betting-system.com/DATABASE_ISSUES"

    - alert: DatabaseHighQueryTime
      expr: |
        pg_stat_activity_max_tx_duration{state="active"} > 30
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "Long-running database queries detected"
        description: "Queries running for over 30 seconds detected"

    - alert: DatabaseReplicationLag
      expr: |
        pg_replication_lag > 60
      for: 5m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "Database replication lag is high"
        description: "Replication lag is {{ $value }}s"

    - alert: RedisDown
      expr: up{job="redis"} == 0
      for: 1m
      labels:
        severity: critical
        component: redis
      annotations:
        summary: "Redis is down"
        description: "Redis instance is unreachable"

    - alert: RedisMemoryHigh
      expr: |
        redis_memory_used_bytes / redis_memory_max_bytes > 0.8
      for: 10m
      labels:
        severity: warning
        component: redis
      annotations:
        summary: "Redis memory usage high"
        description: "Redis memory usage is at {{ $value | humanizePercentage }}"

    - alert: DiskSpaceLow
      expr: |
        node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
      for: 15m
      labels:
        severity: critical
        component: infrastructure
      annotations:
        summary: "Low disk space on {{ $labels.instance }}"
        description: "Disk space is below 10% on {{ $labels.instance }}"

    - alert: NodeNotReady
      expr: |
        kube_node_status_condition{condition="Ready", status="true"} == 0
      for: 5m
      labels:
        severity: critical
        component: infrastructure
      annotations:
        summary: "Kubernetes node {{ $labels.node }} is not ready"
        description: "Node {{ $labels.node }} has been not ready for 5 minutes"

    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="betting-system"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "Pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"

    - alert: HPAMaxReplicasReached
      expr: |
        kube_horizontalpodautoscaler_status_current_replicas{namespace="betting-system"}
          ==
        kube_horizontalpodautoscaler_spec_max_replicas{namespace="betting-system"}
      for: 15m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"
        description: "The HPA has scaled to its maximum. Consider increasing the limit."
