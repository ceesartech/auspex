groups:
  - name: api_alerts
    interval: 30s
    rules:

    - alert: HighErrorRate
      expr: |
        (
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (app)
          /
          sum(rate(http_requests_total[5m])) by (app)
        ) > 0.05
      for: 5m
      labels:
        severity: critical
        component: api
      annotations:
        summary: "High 5xx error rate on {{ $labels.app }}"
        description: "{{ $labels.app }} has {{ $value | humanizePercentage }} error rate (threshold: 5%)"
        runbook: "https://runbooks.betting-system.com/HIGH_ERROR_RATE"

    - alert: HighLatency
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)
        ) > 2
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "High API latency on {{ $labels.endpoint }}"
        description: "P95 latency is {{ $value }}s (threshold: 2s)"

    - alert: APIDown
      expr: up{job="betting-api"} == 0
      for: 1m
      labels:
        severity: critical
        component: api
      annotations:
        summary: "API instance down"
        description: "API instance {{ $labels.instance }} is down"
        runbook: "https://runbooks.betting-system.com/API_DOWN"

    - alert: HighMemoryUsage
      expr: |
        (
          container_memory_usage_bytes{pod=~"betting-api.*"}
          /
          container_spec_memory_limit_bytes{pod=~"betting-api.*"}
        ) > 0.9
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "High memory usage on {{ $labels.pod }}"
        description: "Memory usage is {{ $value | humanizePercentage }}"

    - alert: HighCPUUsage
      expr: |
        rate(container_cpu_usage_seconds_total{pod=~"betting-api.*"}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "High CPU usage on {{ $labels.pod }}"
        description: "CPU usage is {{ $value | humanizePercentage }}"

    - alert: APISlowPredictions
      expr: |
        histogram_quantile(0.95,
          sum(rate(prediction_duration_seconds_bucket[5m])) by (le)
        ) > 5
      for: 5m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "Slow prediction generation"
        description: "P95 prediction latency is {{ $value }}s (threshold: 5s)"

    - alert: WebSocketConnectionDrop
      expr: |
        delta(active_websocket_connections[5m]) < -10
      for: 2m
      labels:
        severity: warning
        component: api
      annotations:
        summary: "Rapid WebSocket connection drop"
        description: "Active WebSocket connections dropped by {{ $value }} in 5 minutes"
