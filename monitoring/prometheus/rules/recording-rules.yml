groups:
  - name: api_recording_rules
    interval: 30s
    rules:

    # Request rate per endpoint (5-minute window)
    - record: job:http_requests:rate5m
      expr: sum(rate(http_requests_total[5m])) by (job, endpoint, method, status)

    # Error rate per endpoint
    - record: job:http_error_rate:rate5m
      expr: |
        sum(rate(http_requests_total{status=~"5.."}[5m])) by (job, endpoint)
        /
        sum(rate(http_requests_total[5m])) by (job, endpoint)

    # P95 latency
    - record: job:http_request_duration_seconds:p95
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job, endpoint)
        )

    # P99 latency
    - record: job:http_request_duration_seconds:p99
      expr: |
        histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job, endpoint)
        )

  - name: model_recording_rules
    interval: 5m
    rules:

    # Rolling 7-day accuracy (approximated from counters)
    - record: model_accuracy_7d
      expr: |
        sum(increase(predictions_correct[7d])) by (model_version)
        /
        sum(increase(predictions_total[7d])) by (model_version)

    # Rolling 30-day accuracy
    - record: model_accuracy_30d
      expr: |
        sum(increase(predictions_correct[30d])) by (model_version)
        /
        sum(increase(predictions_total[30d])) by (model_version)

    # Prediction throughput
    - record: model:predictions:rate1h
      expr: sum(rate(predictions_total[1h])) by (predicted_outcome, model_version)

    # Confidence percentiles
    - record: model:prediction_confidence:p50
      expr: histogram_quantile(0.50, sum(rate(prediction_confidence_bucket[1h])) by (le))

    - record: model:prediction_confidence:p10
      expr: histogram_quantile(0.10, sum(rate(prediction_confidence_bucket[1h])) by (le))

  - name: infrastructure_recording_rules
    interval: 1m
    rules:

    # CPU utilisation per pod
    - record: pod:container_cpu_usage:rate5m
      expr: |
        sum(rate(container_cpu_usage_seconds_total{namespace="betting-system"}[5m]))
        by (pod, container)

    # Memory utilisation ratio per pod
    - record: pod:container_memory_usage_ratio
      expr: |
        container_memory_usage_bytes{namespace="betting-system"}
        /
        container_spec_memory_limit_bytes{namespace="betting-system"}

    # Redis cache hit rate
    - record: redis:cache_hit_rate:rate5m
      expr: |
        sum(rate(cache_hits_total[5m]))
        /
        sum(rate(cache_requests_total[5m]))

    # DB connection pool utilisation
    - record: postgres:connection_pool_utilisation
      expr: pg_stat_activity_count / pg_settings_max_connections
