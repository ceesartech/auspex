# Alertmanager config for the single-VM deployment.
#
# This is a TEMPLATE: the alertmanager container seds __TELEGRAM_BOT_TOKEN__
# and __TELEGRAM_CHAT_ID__ in at startup (alertmanager does not expand env vars
# itself, and its busybox image has no envsubst). See the alertmanager service
# entrypoint in docker-compose.yml.
#
# One user, one channel: everything routes to Telegram. Warnings are grouped
# and slow-repeated; criticals fire immediately and repeat every 15m until
# resolved.

global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ['alertname', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      group_wait: 0s
      repeat_interval: 15m
      continue: false
      receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: '__TELEGRAM_BOT_TOKEN__'
        chat_id: __TELEGRAM_CHAT_ID__
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          <b>{{ .Status | toUpper }}{{ if eq .Status "firing" }} ({{ .Alerts.Firing | len }}){{ end }}</b>
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}{{ if .Labels.component }} · {{ .Labels.component }}{{ end }}]
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # A critical alert for a component silences its warnings.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'component']
