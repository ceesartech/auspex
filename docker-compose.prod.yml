# Production overlay for the personal-VM deployment path.
#
# Usage on the VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds:
#   - frontend: Next.js standalone server
#   - caddy:    HTTPS reverse proxy with automatic Let's Encrypt certs.
#               Routes:
#                 ${AUSPEX_DOMAIN}            -> frontend:3000
#                 ${AUSPEX_DOMAIN}/api/       -> api:8000/api/
#                 ${AUSPEX_DOMAIN}/ws         -> api:8000/ws
#                 ${AUSPEX_DOMAIN}/metrics    -> api:8000/metrics (basic auth)
#                 grafana.${AUSPEX_DOMAIN}    -> grafana:3000
#
# Required env vars (set in .env):
#   AUSPEX_DOMAIN         e.g. auspex.example.com
#   AUSPEX_ACME_EMAIL     e.g. you@example.com (for Let's Encrypt)
#
# Local-only / dev: do NOT use this overlay; the base docker-compose.yml
# exposes the API on :8000 and you can run frontend via `npm run dev`.

# Bounded container logs (audit doc §6.2): json-file logs grew unbounded
# (~40MB/day; 785MB accumulated before the 2026-07 cleanup). Applied
# per-service; takes effect when a container is recreated (every CI
# deploy does).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Per-service memory ceilings (audit doc §6.2). These are runaway GUARDS, not
# working constraints — sized ~2-4x observed steady-state (docker stats: whole
# stack ~4.5 GiB idle on a 15.24 GiB box), so normal operation is never capped.
# The api ceiling (10g) is deliberately generous because model training runs
# in-process; a retrain spiking past 10g would trip HostMemoryHigh (batch-4
# alert) before any OOM. mem_limit takes effect on container recreate.
services:
  frontend:
    logging: *default-logging
    mem_limit: 512m
    build:
      context: services/frontend
      dockerfile: ../../docker/Dockerfile.frontend
      # NEXT_PUBLIC_* must be passed as build args, not runtime env —
      # Next.js inlines them into the JS bundle at `npm run build`.
      args:
        NEXT_PUBLIC_API_URL: https://${AUSPEX_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${AUSPEX_DOMAIN}
    container_name: auspex-frontend
    environment:
      - NODE_ENV=production
    networks:
      - betting-network
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: the container resolves localhost to
      # ::1 first and Next.js binds IPv4 only, so the wget failed and
      # the container sat "unhealthy" for weeks while serving fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    logging: *default-logging
    mem_limit: 256m
    image: caddy:2-alpine
    container_name: auspex-caddy
    environment:
      - AUSPEX_DOMAIN=${AUSPEX_DOMAIN}
      - AUSPEX_ACME_EMAIL=${AUSPEX_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    networks:
      - betting-network
    restart: unless-stopped

  # In production we don't want the raw API/Grafana ports exposed to the
  # public internet — only Caddy should reach them. Override the upstream
  # service definitions to drop their published ports + set memory ceilings.
  api:
    logging: *default-logging
    mem_limit: 10g       # runs model training in-process — generous headroom
    ports: []
  grafana:
    logging: *default-logging
    mem_limit: 512m
    ports: []
  prometheus:
    logging: *default-logging
    mem_limit: 1g
    ports: []
  mlflow:
    logging: *default-logging
    mem_limit: 1g
    ports: []
  redis:
    logging: *default-logging
    mem_limit: 1g        # above the 768mb maxmemory so eviction precedes OOM
    ports: []
  postgres:
    logging: *default-logging
    mem_limit: 3g
    ports: []
  airflow-webserver:
    logging: *default-logging
    mem_limit: 1536m
  airflow-scheduler:
    logging: *default-logging
    mem_limit: 1536m
  celery-worker:
    logging: *default-logging
    mem_limit: 1536m
  alertmanager:
    logging: *default-logging
    mem_limit: 256m
  node-exporter:
    logging: *default-logging
    mem_limit: 128m
  postgres-exporter:
    logging: *default-logging
    mem_limit: 128m
  redis-exporter:
    logging: *default-logging
    mem_limit: 128m

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
