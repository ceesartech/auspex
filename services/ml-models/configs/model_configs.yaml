# Model Configurations for CeesarBet Predict ML Service
# Each model defines hyperparameters, training settings, and target tasks.

models:
  xgboost_match_outcome:
    model_type: xgboost
    prediction_task: match_outcome
    version: "1.0.0"
    hyperparameters:
      objective: "multi:softprob"
      num_class: 3
      max_depth: 8
      learning_rate: 0.05
      n_estimators: 500
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 3
      gamma: 0.1
      reg_alpha: 0.01
      reg_lambda: 1.0
      tree_method: hist
      random_state: 42
    training:
      early_stopping_rounds: 50
      eval_metric: mlogloss

  lightgbm_match_outcome:
    model_type: lightgbm
    prediction_task: match_outcome
    version: "1.0.0"
    hyperparameters:
      objective: multiclass
      num_class: 3
      boosting_type: gbdt
      num_leaves: 64
      learning_rate: 0.05
      n_estimators: 400
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_alpha: 0.01
      reg_lambda: 1.0
      random_state: 42
    training:
      early_stopping_rounds: 50

  lightgbm_over_under:
    model_type: lightgbm
    prediction_task: over_under
    version: "1.0.0"
    hyperparameters:
      objective: binary
      boosting_type: gbdt
      num_leaves: 64
      learning_rate: 0.05
      n_estimators: 400
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      random_state: 42
    training:
      early_stopping_rounds: 50

  neural_network:
    model_type: neural_network
    prediction_task: match_outcome
    version: "1.0.0"
    hyperparameters:
      hidden_layers: [256, 128, 64, 32]
      dropout_rate: 0.3
      learning_rate: 0.001
      batch_size: 256
      epochs: 100
      batch_norm: true
    training:
      early_stopping_patience: 15
      reduce_lr_patience: 5

  poisson:
    model_type: poisson
    prediction_task: match_outcome
    version: "1.0.0"
    hyperparameters:
      max_goals: 6
      home_advantage: 0.25
      regularization: 0.001
      max_iterations: 1000
      convergence_threshold: 1.0e-6

  dixon_coles:
    model_type: dixon_coles
    prediction_task: match_outcome
    version: "1.0.0"
    # Mirror of predictors/model_config.py:DIXON_COLES_CONFIG (that module
    # is what training actually reads). This is the SOCCER FULL-TIME config
    # and the only Dixon-Coles the 2026-09 refit was measured on. The NHL /
    # halftime / second-half trainers take the pinned copy instead
    # (model_config.dixon_coles_config_pinned_to_legacy_fit) because they
    # bypass train_all_models and therefore both promote gates.
    # No home_advantage key here either: the 0.25 default in
    # PoissonMatchPredictor is what reaches the pinned copies, which is the
    # separately-tracked NHL defect (0.25 against league_avg_goals ~3.10).
    hyperparameters:
      max_goals: 10
      rho_init: -0.13
      time_decay: 0.00095      # per day; 730-day half-life
      regularization: 20.0     # shrinkage prior, in effective matches
      per_league_baselines: true
      league_shrinkage: 200.0  # effective matches of shrink to the global mean
      max_iterations: 500
      convergence_threshold: 1.0e-5

  ensemble:
    model_type: ensemble
    prediction_task: match_outcome
    version: "1.0.0"
    hyperparameters:
      combination_method: weighted_average
      optimize_weights: true
      weight_optimization_metric: log_loss
      min_weight: 0.05

# Hyperparameter optimization settings
optimization:
  n_trials: 100
  timeout: 3600  # seconds
  metric: log_loss
  direction: minimize
  sampler: tpe
  pruner: median

# Cross-validation settings
cross_validation:
  n_splits: 5
  min_train_size: 500
  gap: 0
  date_column: match_date

# Calibration settings
calibration:
  method: isotonic
  n_bins: 10

# Inference settings
inference:
  onnx_enabled: true
  cache_ttl: 300
  batch_size: 256
  max_latency_ms: 100
