apiVersion: v1
kind: ConfigMap
metadata:
  name: betting-system-config
  namespace: betting-system
  labels:
    app: betting-system
data:
  POSTGRES_DB: "betting_system"
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  ENVIRONMENT: "production"
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  USER_TIMEZONE: "America/Denver"
  ENABLE_WEB_SCRAPING: "true"
  ENABLE_MODEL_TRAINING: "true"
  ENABLE_PREDICTIONS: "true"
  PROMETHEUS_PORT: "9090"
  GRAFANA_PORT: "3000"
