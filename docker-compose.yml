# Bounded container logs (audit doc §6.2): json-file logs grew unbounded
# (~40MB/day; 785MB accumulated before the 2026-07 cleanup). Applied
# per-service; takes effect when a container is recreated (every CI
# deploy does).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ============= CORE INFRASTRUCTURE =============

  postgres:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: betting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/data-ingestion/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betting-network
    restart: unless-stopped

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: betting-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Start with requirepass only when a password is actually provided.
    # $$REDIS_PASSWORD is compose-escaped so the shell inside the container
    # reads it from the container's environment at runtime.
    command: >
      sh -c "[ -n \"$$REDIS_PASSWORD\" ] &&
             exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" ||
             exec redis-server --appendonly yes"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "[ -n \"$$REDIS_PASSWORD\" ] && redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betting-network
    restart: unless-stopped

  # ============= AIRFLOW =============

  airflow-init:
    logging: *default-logging
    image: apache/airflow:2.8.0-python3.11
    container_name: betting-airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - _AIRFLOW_DB_UPGRADE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./services/data-ingestion/dags:/opt/airflow/dags
      - ./services/data-ingestion/logs:/opt/airflow/logs
      - ./services/data-ingestion/plugins:/opt/airflow/plugins
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - betting-network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow db upgrade &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: betting-airflow-webserver
    # Add the airflow user to the host's docker group so it can access
    # the bind-mounted docker socket. 999 is the default docker GID on
    # Ubuntu 22.04 (verify on the VM with `getent group docker`).
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./services/data-ingestion/dags:/opt/airflow/dags
      - ./services/data-ingestion/logs:/opt/airflow/logs
      - ./services/data-ingestion/plugins:/opt/airflow/plugins
      # Mount the host docker socket + the deploy dir so DAGs can run
      # `docker compose -f /opt/auspex/docker-compose.yml exec api ...`.
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/auspex:/opt/auspex:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - betting-network
    restart: unless-stopped

  airflow-scheduler:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: betting-airflow-scheduler
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      # Webserver and scheduler must share this so the webserver's HTTP
      # log-fetch from the scheduler's task-runner endpoint is allowed.
      # Without it: 403 FORBIDDEN on "Could not read served logs".
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      # Long-running CPU-bound tasks (e.g. Poisson MLE in train_all_models)
      # hold the GIL, which starves the LocalTaskJob heartbeat thread.
      # Without this bump the scheduler treats them as zombies after 5
      # minutes and SIGTERMs the process mid-train. 1 hour is the SLA
      # we'd accept for any single task — anything slower needs profiling.
      - AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD=3600
      # Telegram failure alerting — every DAG's on_failure_callback
      # (dags/alerting.py) reads these to page on a broken task.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ENABLE_TELEGRAM_NOTIFICATIONS=${ENABLE_TELEGRAM_NOTIFICATIONS:-false}
    volumes:
      - ./services/data-ingestion/dags:/opt/airflow/dags
      - ./services/data-ingestion/logs:/opt/airflow/logs
      - ./services/data-ingestion/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/auspex:/opt/auspex:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - betting-network
    restart: unless-stopped

  # ============= API SERVICE =============

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: betting-api
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - MODEL_PATH=/app/models
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Third-party data sources used by scripts/.
      - THE_ODDS_API_KEY=${THE_ODDS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ENABLE_TELEGRAM_NOTIFICATIONS=${ENABLE_TELEGRAM_NOTIFICATIONS:-false}
      # The Racing API (theracingapi.com) — UK + Irish horse racing.
      # HTTP Basic auth; both env vars required for any racing ingest.
      - THE_RACING_API_USER=${THE_RACING_API_USER:-}
      - THE_RACING_API_PASS=${THE_RACING_API_PASS:-}
      # Visual Crossing paid weather API (chosen 2026-06-04 to retest
      # the weather-features hypothesis at 1-4km resolution after
      # Open-Meteo's 11km grid showed no signal). Used only when
      # scripts/fetch_weather_visual_crossing.py runs; missing
      # → that script SystemExits cleanly without affecting the
      # Open-Meteo path.
      - VISUAL_CROSSING_API_KEY=${VISUAL_CROSSING_API_KEY:-}
      # PostgreSQL backup config — daily DAG (db_backup_daily) calls
      # scripts/backup_postgres.py which writes a local dump and
      # optionally uploads to S3-compatible storage. All BACKUP_*
      # vars are optional; without BACKUP_S3_BUCKET the backup is
      # local-only. RECOMMENDED remote: Backblaze B2 (~$0.50/yr at our
      # scale, true off-Hetzner DR). For B2 set in .env:
      #   BACKUP_S3_BUCKET=auspex-backups
      #   BACKUP_S3_ENDPOINT_URL=https://s3.<region>.backblazeb2.com
      #   AWS_ACCESS_KEY_ID=<B2 keyID>
      #   AWS_SECRET_ACCESS_KEY=<B2 applicationKey>
      # The signing region is AUTO-DERIVED from the B2 endpoint host by
      # the script, so AWS_DEFAULT_REGION below does NOT need changing
      # for B2 (it's only the fallback for real AWS S3). See OPERATIONS.md.
      - BACKUP_LOCAL_DIR=${BACKUP_LOCAL_DIR:-/app/backups}
      - BACKUP_LOCAL_RETENTION=${BACKUP_LOCAL_RETENTION:-7}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-postgres/}
      - BACKUP_S3_ENDPOINT_URL=${BACKUP_S3_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./models:/app/models
      - ./services/api:/app/services/api
      # Bind-mount services/ml-models so edits to training/, predictors/,
      # utils/ flow into the container without rebuilding the image —
      # otherwise `docker compose exec api python -m training.train_all_models`
      # would still run yesterday's baked-in code after a git pull. The
      # Dockerfile still COPYs ml-models in for production image deploys.
      - ./services/ml-models:/app/services/ml-models
      # Bind-mount scripts/ so edits to fetch_live_odds.py /
      # promote_raw.py / etc. flow into the container without
      # rebuilding the image. The Dockerfile still COPYs them in for
      # production deploys where the image is rolled forward.
      - ./scripts:/app/scripts
      # Bind-mount data/ — currently holds soccer_team_stadiums.json
      # (the home-stadium fallback the VC weather fetcher uses when
      # matches.venue is NULL). Editable without rebuild for the same
      # reason as scripts/.
      - ./data:/app/data
      # Bind-mount backups/ — daily pg_dump output lands here for
      # quick local restore (last 7 days). Host directory must be
      # owned by UID 1000 (appuser) so the in-container pg_dump
      # can write to it: `sudo chown -R 1000:1000 /opt/auspex/backups`.
      - ./backups:/app/backups
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - betting-network
    restart: unless-stopped

  # ============= CELERY WORKERS =============

  celery-worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: betting-celery-worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
    volumes:
      - ./services/api:/app/services/api
      # Match api's mount so celery workers also run the latest
      # training/predictor code after a git pull.
      - ./services/ml-models:/app/services/ml-models
      - ./models:/app/models
    # WORKDIR + PYTHONPATH from docker/Dockerfile.api put us in
    # /app/services/api/src, so celery_app.py is importable as a
    # top-level module. The fully-qualified services.api.celery_app
    # path fails because services/__init__.py doesn't exist.
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    # Override the api image's baked-in HTTP healthcheck (Dockerfile.api
    # curls :8000/health) — this container runs no HTTP server, so it
    # reported "unhealthy" 24/7 while working, training responders to
    # ignore the signal. A broker ping is the real liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -t 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      - redis
      - postgres
    networks:
      - betting-network
    restart: unless-stopped

  # ============= MONITORING =============

  prometheus:
    logging: *default-logging
    image: prom/prometheus:latest
    container_name: betting-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - betting-network
    restart: unless-stopped

  grafana:
    logging: *default-logging
    image: grafana/grafana:latest
    container_name: betting-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - betting-network
    restart: unless-stopped

  # ============= MLFLOW =============

  mlflow:
    logging: *default-logging
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: betting-mlflow
    environment:
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5001"
    # Use SQLite for local dev — avoids needing a separate 'mlflow' Postgres DB.
    # In production, override MLFLOW_BACKEND_STORE_URI via K8s secret/env.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    networks:
      - betting-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  mlflow_data:
    driver: local

networks:
  betting-network:
    driver: bridge
